[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "0.1.0"
description = "A lightweight network diagnostics CLI tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netprobe = "netprobe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
lint = [
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
